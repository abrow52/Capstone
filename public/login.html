<!DOCTYPE html>
<html lang="en">

<head>
    <!--The Login Page-->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="login.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="navbar shadow-sm">
          <div class="container">
            <a href="/" class="navbar-brand d-flex align-items-center">
              <strong>Schedule Genie</strong>
            </a>
            <div>
              <ul style="display:flex; list-style-type: none; gap: 10px">
                  <li class="nav-item"><a class="nav-link" aria-current="page" href="/home">Home</a></li>
                  <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                  <!-- <% if (user && (user.role === "admin" || user.role === "employee")) { %>
                  <li class="nav-item">
                      <a class="nav-link" href="/events">Events</a>
                  </li>
                <% } %>
                <% if (user && user.role === "admin") { %>
                  <li class="nav-item">
                      <a class="nav-link" href="/users">Users</a>
                  </li>
                <% } %> -->
              </ul>
            </div>
          </div>
        </div>
      </header>
      <section class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <form id = "login" style="width: 23rem;">

          <h3 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px;">Log in</h3>

          <div data-mdb-input-init class="form-outline mb-4">
            <input type="text" id="username" name="username" class="form-control form-control-lg" required/>
            <label class="form-label" for="username">Username</label>
          </div>

          <div data-mdb-input-init class="form-outline mb-4">
            <input type="password" id="password" name="password" class="form-control form-control-lg" required/>
            <label class="form-label" for="password">Password</label>
          </div>

          <p id ="error" class = "error-message"> </p>

          <div class="pt-1 mb-4">
            <button class="btn btn-info btn-lg btn-block" type="submit">Login</button>
          </div>

        </form>

        
      </section>
        
</body>

</html>
