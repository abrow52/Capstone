<!DOCTYPE html>
<html>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="//cdnjs.cloudflare.com/ajax/libs/moment.js/2.5.1/moment.min.js"></script>

  <header>
    <title>Home</title>
    <div class="navbar shadow-sm">
      <div class="container">
        <!-- <a href="/" class="navbar-brand d-flex align-items-center">
          <strong>Schedule Genie</strong>
        </a> -->
        <a class="navbar-brand d-flex align-items-center">
          <strong id="welcomeUsername"></strong>
        </a>
        <div class="align-items-center">
          <ul style="display:flex; list-style-type: none; gap: 10px">
              <li class="nav-item"><a class="nav-link" href="/home">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="/requests">Requests</a></li>
              <li class="nav-item"><a class="nav-link" href="/hub">Scheudling Hub</a></li>
              <li class="nav-item"><a class="nav-link" aria-current="page" href="/dash">Employee Dashboard</a></li>
          </ul>
        </div>
      </div>
    </div>
  </header>
  <body>
    <div class="col-md-6">
      <button class="btn btn-primary" type="button" onclick="unhideForm()" style=" margin-left: 20px; margin-bottom: 20px;">Add Employee</button>
      <form id="addUserForm" style="max-width: 500px; margin-left: 20px; display:none;">
        <div class="mb-3">
          <label for="newUserName" class="form-label">Employee Name</label>
          <input type="text" class="form-control" id="newUserName"
                 name="name" placeholder="Enter employee name" required>
        </div>
      
        <div class="mb-3">
          <label for="newPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="newPassword"
                 name="password" placeholder="Enter password" required>
        </div>
      
        <div class="mb-3">
          <label for="newTitle" class="form-label">Job Title</label>
          <input type="text" class="form-control" id="newTitle"
                 name="title" placeholder="Enter job title" required>
        </div>
      
        <div class="mb-3">
          <label for="newEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="newEmail"
                 name="email" placeholder="Enter email" required>
        </div>
        <div style="gap: 100px;">
          <button type="submit">Submit</button>
          <button onclick="hideForm()">Cancel</button>
        </div>
      </form>
    </div>
    <script type="module" src="./addUser.js"></script>
    <script>
      function unhideForm() {
          document.getElementById("addUserForm").style.display = "block";
      }
      function hideForm() {
            document.getElementById("addUserForm").style.display = "none";
        }
    </script>
  </body>
</html>
