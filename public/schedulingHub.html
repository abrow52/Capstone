<!DOCTYPE html>
<html>
  <link rel="stylesheet" href="css/calendar-grid.css">
  <link rel="stylesheet" href="css/calendar-list.css">
  <link rel="stylesheet" href="css/openShifts.css">
  <link rel="stylesheet" href="css/shifts.css">
  <link rel="stylesheet" href="css/messages.css" >
  <link rel="stylesheet" href="css/universal.css" >
  <script type="module" src="js/calendar.js"></script>
  <script type="module" src="js/shifts.js"></script>
  <script type="module" src="js/messages.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="//cdnjs.cloudflare.com/ajax/libs/moment.js/2.5.1/moment.min.js"></script>

  <header id="pageHead">
    <title>Home</title>
    <div class="navbar shadow-sm">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center">
          <strong id="welcomeUsername"></strong>
        </a>
        <div id = "navBar">
          <div class="align-items-center">
            <ul  id="navItems" style="display:flex; list-style-type: none; gap: 10px">
                <li class="nav-item"><a class="nav-link" href="/home">Home</a></li>
                <li class="nav-item" id = "managerLink" style = "display:none;"><a class="nav-link" aria-current="page" href="/hub">Scheduling Hub</a></li>
                <li class="nav-item"><a class="nav-link" href="/dash">Employee Dashboard</a></li>
                <li class="nav-item">
                  <button type="button" id="openMailbox" class="open-button" style="border:none; background:none; padding:0;">
                      Mailbox
                  </button>
                </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </header>
  <body data-calendar-view="all" id="pageBody"> 
    <!-- Mailbox overlay -->
    <div id="myForm" class="mailbox-overlay" style="display:none;">
      <div class="mailbox-window">
        <div class="mailbox-header">
          <h2>Mailbox</h2>
          <!-- <button type="button" id="showCompose" class="btn btn-primary">
            Compose Message
          </button> -->
          <button type="button" id="closeMailbox">✕</button>
        </div>
        <!-- INBOX VIEW -->
        <div id="inboxView">
          <button type="button" id="showCompose" class="btn btn-primary">
            Compose Message
          </button>
          <h5>Inbox</h5>
          <div id="mail"></div>
        </div>
        <!-- READ MESSAGE VIEW -->
        <div id="readMessageView" style="display:none;">
          <button type="button" id="backToInbox" class="btn btn-secondary">
            ← Back to Inbox
          </button>
          <div id="messageDetails"></div>
          <form id="replyForm">
            <label for="replyBody">Write a reply</label>
            <textarea id="replyBody" required></textarea>
            <button type="submit" class="btn btn-primary">Send Reply</button>
          </form>
        </div>
        <!-- COMPOSE MESSAGE VIEW -->
        <div id="composeView" style="display:none;">
          <button type="button" id="backFromCompose" class="btn btn-secondary">
            ← Back to Inbox
          </button>
          <h5>New Message</h5>
          <form id="sendMessageForm">
            <label for="employee-name">To</label>
            <select id="employee-name" required>
              <option value="">Select an employee</option>
            </select>
            <label for="messageSubject">Subject</label>
            <input type="text" id="messageSubject" required>
            <label for="messageBody">Message</label>
            <textarea id="messageBody" required></textarea>
            <button type="submit" class="btn btn-primary">
              Send Message
            </button>
          </form>
        </div>
      </div>
    </div>
    <div id = "home"> 
       <!-- left column -->
      <div class="calendar-section">
          <div class="calendarBtns">
            <button id="toggleCalendarView" type="button">
                Switch to List View
            </button>
            <!-- <button id="calendarFilter" type="button">
                Filter
            </button> -->
          </div>
          <div id="calendar"></div>
      </div>
      <!-- Right column -->
      <div class="sidebar">
        <div class="schedule">
          <div id="createbtn">
              <button id="showCreateShifts" type="button">
                  Create Shifts
              </button>
          
              <button id="createScheduleBtn" type="button">
                  Create Schedule
              </button>
          </div>
          
          <!-- Schedule creation controls -->
          <div id="scheduleModeControls" style="display:none;">
              <h5>Creating Schedule</h5>
              <p>Select a shift on the calendar to begin assigning employees.</p>
              <div id="shiftAssignmentPanel" style="display:none;">
                <hr>
                <!-- <h5>Assign Employees</h5> -->
                <h5>Shift Details</h5>
              
                <div id="selectedShiftDetails"></div>
              
                <h6>Available Employees</h6>
                <div id="availableEmployees">
                  Select a shift on the calendar.
                </div>
                <hr>
                <button id="saveScheduleBtn" type="button">
                  Save Schedule
                </button>
              </div>
              <!-- <h5>Creating Schedule</h5>
              <p>Select a shift on the calendar to begin assigning employees.</p> -->
          
              <button id="exitScheduleMode" type="button">
                  Exit Schedule Creation
              </button>
          </div>
          <div class="card" id="shiftCard">
            <form id="shiftsbtn" style="display:none;">
              <h3>Create Shifts</h3>
              <label for="shiftType">Shift type</label>
              <select id="shiftType" name="shiftType" required="">
                <option value="">Select type</option>
                <option value="Morning">Morning</option>
                <option value="Evening">Evening</option>
                <option value="Night">Night</option>
              </select>
              <div class="row">
                <div>
                  <label for="startTime">Start Time</label>
                  <input type="time" id="startTime" name="startTime" required="">
                </div>
                <div>
                  <label for="endTime">End Time</label>
                  <input type="time" id="endTime" name="endTime" required="">
                </div>
                <div>
                  <label for="shiftDays">Repeat Shift</label>
                  <select id="shiftDays" name="shiftDays" multiple required>
                    <option value="">Select type</option>
                    <option value="Sunday">Sunday</option>
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                  </select>
                </div>
              </div>
              <button type="submit">Save Shifts</button>
              <button type="button" id="closeShiftForm" onclick="hideForm()">Cancel</button>
            </form>
          </div>
      </div>

      </div>
    </div>
  </body>
  
  <script>
    const calendar = document.getElementById("calendar");
    const toggleButton = document.getElementById("toggleCalendarView");

    toggleButton.addEventListener("click", () => {
      const isListView = calendar.classList.toggle("list-view");

      toggleButton.textContent = isListView
        ? "Switch to Calendar View"
        : "Switch to List View";
    });

  </script>
  <script>
    function openForm() {
        document.getElementById("myForm").style.display = "block";
    }
    function closeForm() {
        document.getElementById("myForm").style.display = "none";
    }
  </script>
</html>
