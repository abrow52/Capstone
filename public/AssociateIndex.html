  <header>

    <div class="navbar shadow-sm">
      <div class="container">

          <strong>Schedule Genie</strong>

        <a class="navbar-brand d-flex align-items-center">
          <strong id="welcomeUsername"></strong>

        <div class="align-items-center">
          <ul style="display:flex; list-style-type: none; gap: 10px">

  <body> 
    
    <div id = "home"> 
      <div>
        <button id="toggleCalendarView" type="button">
          Switch to List View 
          </button>

        <div id="calendar"></div>
        </div>
          <div class = "openShifts">
            <h5>Open Shifts</h5>
            <div id = "shiftList"> </div>
          </div>
    </div>
  </body>
  
  <script>
    const calendar = document.getElementById("calendar");
    const toggleButton = document.getElementById("toggleCalendarView");

    toggleButton.addEventListener("click", () => {
      const isListView = calendar.classList.toggle("list-view");

      toggleButton.textContent = isListView
        ? "Switch to Calendar View"
        : "Switch to List View";
    });

  </script>
