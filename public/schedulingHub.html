<!DOCTYPE html>
<html>
  <link rel="stylesheet" href="css/calendar-grid.css">
  <script type="module" src="app.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="//cdnjs.cloudflare.com/ajax/libs/moment.js/2.5.1/moment.min.js"></script>
  <link rel="stylesheet" href="calendar-list.css">

  <header>
    <title>Home</title>
    <div class="navbar shadow-sm">
      <div class="container">
        <!-- <a href="/" class="navbar-brand d-flex align-items-center">
          <strong>Schedule Genie</strong>
        </a> -->
        <a class="navbar-brand d-flex align-items-center">
          <strong id="welcomeUsername"></strong>
        </a>
        <div class="align-items-center">
          <ul style="display:flex; list-style-type: none; gap: 10px">
              <li class="nav-item"><a class="nav-link" href="/home">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="/requests">Requests</a></li>
              <li class="nav-item"><a class="nav-link" aria-current="page" href="/hub">Scheudling Hub</a></li>
              <li class="nav-item"><a class="nav-link" href="/dash">Employee Dashboard</a></li>
          </ul>
        </div>
      </div>
    </div>
  </header>
  <body>
    <button id="toggleCalendarView" type="button">
      Switch to List View
    </button>
    <div id="calendar"></div>

  </body>
  <script>
    const calendar = document.getElementById("calendar");
    const toggleButton = document.getElementById("toggleCalendarView");

    toggleButton.addEventListener("click", () => {
      const isListView = calendar.classList.toggle("list-view");

      toggleButton.textContent = isListView
        ? "Switch to Calendar View"
        : "Switch to List View";
    });

  </script>
</html>
