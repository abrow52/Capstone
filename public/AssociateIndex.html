<!DOCTYPE html>
<html>
  <link rel="stylesheet" href="css/calendar-grid.css">
  <link rel="stylesheet" href="css/calendar-list.css">
  <link rel="stylesheet" href="css/openShifts.css">
  <link rel="stylesheet" href="css/requests.css">
  <link rel="stylesheet" href="css/messages.css" >
  <link rel="stylesheet" href="css/universal.css" >
  <script type="module" src="js/calendar.js"></script>
  <script type="module" src="js/requests.js"></script>
  <script type="module" src="js/messages.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="//cdnjs.cloudflare.com/ajax/libs/moment.js/2.5.1/moment.min.js"></script>

  <header id="pageHead">
    <title>Home</title>
    <div class="navbar shadow-sm">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center">
          <strong id="welcomeUsername"></strong>
        </a>
        <div id = "navBar">
          <div class="align-items-center">
            <ul  id="navItems" style="display:flex; list-style-type: none; gap: 10px">
                <li class="nav-item"><a class="nav-link" aria-current="page" href="/home">Home</a></li>
                <li class="nav-item" id = "managerLink" style = "display:none;"><a class="nav-link" href="/hub">Scheduling Hub</a></li>
                <li class="nav-item"><a class="nav-link" href="/requests">Requests</a></li>
                <li class="nav-item"><a class="nav-link" href="/dash">Employee Dashboard</a></li>
                <li class="nav-item">
                  <button type="button" id="openMailbox" class="open-button" style="border:none; background:none; padding:0;">
                      Mailbox
                  </button>
                </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </header>
  <body id="pageBody"> 
    <!-- Mailbox overlay -->
    <div id="myForm" class="mailbox-overlay" style="display:none;">
      <div class="mailbox-window">
        <div class="mailbox-header">
          <h2>Mailbox</h2>
          <!-- <button type="button" id="showCompose" class="btn btn-primary">
            Compose Message
          </button> -->
          <button type="button" id="closeMailbox">✕</button>
        </div>
        <!-- INBOX VIEW -->
        <div id="inboxView">
          <button type="button" id="showCompose" class="btn btn-primary">
            Compose Message
          </button>
          <h5>Inbox</h5>
          <div id="mail"></div>
        </div>
        <!-- READ MESSAGE VIEW -->
        <div id="readMessageView" style="display:none;">
          <button type="button" id="backToInbox" class="btn btn-secondary">
            ← Back to Inbox
          </button>
          <div id="messageDetails"></div>
          <form id="replyForm">
            <label for="replyBody">Write a reply</label>
            <textarea id="replyBody" required></textarea>
            <button type="submit" class="btn btn-primary">Send Reply</button>
          </form>
        </div>
        <!-- COMPOSE MESSAGE VIEW -->
        <div id="composeView" style="display:none;">
          <button type="button" id="backFromCompose" class="btn btn-secondary">
            ← Back to Inbox
          </button>
          <h5>New Message</h5>
          <form id="sendMessageForm">
            <label for="employee-name">To</label>
            <select id="employee-name" required>
              <option value="">Select an employee</option>
            </select>
            <label for="messageSubject">Subject</label>
            <input type="text" id="messageSubject" required>
            <label for="messageBody">Message</label>
            <textarea id="messageBody" required></textarea>
            <button type="submit" class="btn btn-primary">
              Send Message
            </button>
          </form>
        </div>
      </div>
    </div>
    <div id = "home"> 
       <!-- left column -->
      <div class="calendar-section">
          <button id="toggleCalendarView" type="button">
              Switch to List View
          </button>
          <div id="calendar"></div>
      </div>
      <!-- Right column -->
      <div class="sidebar">
          <div class="requests">
              <h5>
                  Requests
                  <div id="reqFormBtn">
                    <button>Drop Shift</button>
                    <button onclick="unhideForm()">Time Off</button>
                  </div>
              </h5>
              <div class="card">
                <form id="reqTimeOffForm" style="display:none;">
                  <h3>Request time off</h3>
                  <label for="leaveType">Leave type</label>
                  <select id="leaveType" name="leaveType" required="">
                    <option value="">Select type</option>
                    <option value="vacation">Vacation</option>
                    <option value="sick">Sick leave</option>
                    <option value="personal">Personal</option>
                  </select>
                  <div class="row">
                    <div>
                      <label for="startDate">Start date</label>
                      <input type="date" id="startDate" name="startDate" required="">
                    </div>
                    <div>
                      <label for="endDate">End date</label>
                      <input type="date" id="endDate" name="endDate" required="">
                    </div>
                  </div>
                  <button type="submit">Submit Request</button>
                  <button onclick="hideForm()">Cancel</button>
                </form>
              </div>
              <div>
                <h6><u>Pending</u></h6>
                <div id="pendingReqs"></div>
                <h6><u>Approved</u></h6>
                <div id="approvedReqs"></div>
                <h6><u>Denied</u></h6>
                <div id="deniedReqs"></div>
              </div>
          </div>

          <div class="openShifts">
              <h5>Open Shifts</h5>
              <div id="shiftList"></div>
          </div>

      </div>
    </div>
  </body>
  
  <script>
    const calendar = document.getElementById("calendar");
    const toggleButton = document.getElementById("toggleCalendarView");

    toggleButton.addEventListener("click", () => {
      const isListView = calendar.classList.toggle("list-view");

      toggleButton.textContent = isListView
        ? "Switch to Calendar View"
        : "Switch to List View";
    });

  </script>
  <script>
    function unhideForm() {
        document.getElementById("reqTimeOffForm").style.display = "block";
    }
    function hideForm() {
        document.getElementById("reqTimeOffForm").style.display = "none";
    }
    function openForm() {
        document.getElementById("myForm").style.display = "block";
    }
    function closeForm() {
        document.getElementById("myForm").style.display = "none";
    }
  </script>
</html>
