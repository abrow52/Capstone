<!DOCTYPE html>
<html>
  <link rel="stylesheet" href="css/calendar-grid.css">
  <link rel="stylesheet" href="css/calendar-list.css">
  <link rel="stylesheet" href="css/openShifts.css">
  <link rel="stylesheet" href="css/requests.css">
  <link rel="stylesheet" href="css/messages.css" >
  <link rel="stylesheet" href="css/universal.css" >
   <script type="module" src="js/managerRequest.js "></script>
  <script type="module" src="js/calendar.js"></script>
  <script type="module" src="js/requests.js"></script>
  <script type="module" src="js/messages.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="//cdnjs.cloudflare.com/ajax/libs/moment.js/2.5.1/moment.min.js"></script>


  <header id="pageHead">
    <title>Home</title>
    <div class="navbar shadow-sm">
      <div class="container">
         <a href="/home" class = "nav-link" style = "font-size: 20px;"> <strong id="welcomeUsername"></strong> </a>
        <div id = "navBar">
          <div class="align-items-center">
            <ul  id="navItems" style="display:flex; list-style-type: none; gap: 10px">
              
                <li class="nav-item" id = "managerLink" style = "display:none;"><a class="nav-link" href="/hub">Scheduling Hub</a></li>
                <li class="nav-item"><a class="nav-link" href="/dash">Employee Dashboard</a></li>
                <li class="nav-item">
                  <button type="button" id="openMailbox" class="open-button" style="border:none; background:none; padding:0;">
                      Mailbox
                  </button>
                </li>
                <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn">Log Out</a></li>

            </ul>
          </div>
        </div>
      </div>
    </div>
  </header>
  <body data-calendar-view="personal" id="pageBody"> 
    <!-- Mailbox overlay -->
    <div id="myForm" class="mailbox-overlay" style="display:none;">
      <div class="mailbox-window">
        <div class="mailbox-header">
          <h2>Mailbox</h2>
          <button type="button" id="closeMailbox">✕</button>
        </div>
        <!-- inbox view -->
        <div id="inboxView">
          <button type="button" id="showCompose" class="btn btn-primary">
            Compose Message
          </button>
          <h5>Inbox</h5>
          <div id="mail"></div>
        </div>
        <!-- read message view -->
        <div id="readMessageView" style="display:none;">
          <button type="button" id="backToInbox" class="btn btn-secondary">
            ← Back to Inbox
          </button>
          <div id="messageDetails"></div>
          <form id="replyForm">
            <label for="replyBody">Write a reply</label>
            <textarea id="replyBody" required></textarea>
            <button type="submit" class="btn btn-primary">Send Reply</button>
          </form>
        </div>
        <!-- compose message view -->
        <div id="composeView" style="display:none;">
          <button type="button" id="backFromCompose" class="btn btn-secondary">
            ← Back to Inbox
          </button>
          <h5>New Message</h5>
          <form id="sendMessageForm">
            <label for="employee-name">To</label>
            <select id="employee-name" required>
              <option value="">Select an employee</option>
            </select>
            <label for="messageSubject">Subject</label>
            <input type="text" id="messageSubject" required>
            <label for="messageBody">Message</label>
            <textarea id="messageBody" required></textarea>
            <button type="submit" class="btn btn-primary">
              Send Message
            </button>
          </form>
        </div>
      </div>
    </div>
    
    <div id = "home"> 
       <!-- left column : calendar -->
      <div class="calendar-section">
          <div class="calendarBtns">
            <div class="calendarPeriodButtons">
              <button type="button" class="period-btn active" data-period="day">
                  Day
              </button>
              <button type="button" class="period-btn" data-period="week">
                  Week
              </button>
              <button type="button" class="period-btn" data-period="month">
                  Month
              </button>
            </div>

            <div class="calendarViewToggle">
              <label for="calendarViewToggle" class = "option-label"> List View </label>

                <label class = "switch">
                  <input type="checkbox" id = "calendarViewToggle">
                  <span class="slider round"></span>
                </label>

                <label for="calendarViewToggle" class = "option-label"> Grid View </label>
              </div>
          </div>

          <div id="calendar"></div>
      </div>
      <!-- Right column : sidebar -->
      <div class="sidebar">
          <!-- requests section -->
          <div class="requests">
              <h5>
                  Requests
                  <div id="reqFormBtn">
                    <button type="button" id="showDropShiftForm">
                        Drop Shift
                    </button>
                    <button type="button" id="showTimeOffForm">
                        Time Off
                    </button>
                  </div>
              </h5>
              <div class="card">
                <!-- drop shift -->
                <form id="reqDropShiftForm" style="display:none;">
                  <h3>Request to Drop a Shift</h3>
              
                  <p>Select the shift you would like to drop:</p>
              
                  <div id="myAssignedShifts">
                      Loading your shifts...
                  </div>
              
                  <button type="submit" id = "submitDropShift">Submit Drop Request</button>
                  <button type="button" id="cancelDropShift">Cancel</button>
                </form>
                <!-- time off -->
                <form id="reqTimeOffForm" style="display:none;">
                  <h3>Request time off</h3>
                  <div id="leaveTypeSelect">
                    <label for="leaveType">Leave type</label>
                    <select id="leaveType" name="leaveType" required="">
                      <option value="">Select type</option>
                      <option value="vacation">Vacation</option>
                      <option value="sick">Sick leave</option>
                      <option value="personal">Personal</option>
                    </select>
                  </div>
                  <div class="row">
                    <div class="timeOffDates">
                      <div id="option">
                        <label for="startDate">Start date</label>
                        <input type="date" id="startDate" name="startDate" required="">
                      </div>
                      <div id="option">
                        <label for="endDate">End date</label>
                        <input type="date" id="endDate" name="endDate" required="">
                      </div>
                    </div>
                    <div class="row">
                      <div class="timeOffTimes">
                        <div id="option">
                          <label for="startTime">Start time</label>
                          <input type="time" id="startTime" name="startTime">
                        </div>
                        <div id="option">
                          <label for="endTime">End Time</label>
                          <input type="time" id="endTime" name="endTime">
                        </div>
                      </div>
                    </div>
                  </div>
                  <button type="submit">Submit Request</button>
                  <button type="button" id="cancelTimeOff">Cancel</button>
                </form>
              </div>
              <div class="requestList">
                <details class="requestDetails" open>
                  <summary><h6><u>Pending</u></h6></summary>
                  <div id="pendingReqs"></div>
                </details>

                <details class="requestDetails">
                  <summary>
                    <h6><u>Approved</u></h6></summary>
                  <div id="approvedReqs"></div>
                </details>

                <details class="requestDetails">
                  <summary><h6><u>Denied</u></h6></summary>
                  <div id="deniedReqs"></div>
                </details>

              </div>
          </div>

          <div class="openShifts">
              <h5>Open Shifts</h5>
              <div id="shiftList"></div>
          </div>

      </div>
    </div>
    <div id="requestList"></div>
      <template id="requestTemplate">
        <div class="requestCard">
        <p class="requestType"></p>
        <p class="leaveType"></p>
        <p class="requestName"></p>
        <p class="requestDate"></p>
        <p class="requestTime"></p>
        <p class="requestStatus"></p>

        <button class="approveButton" type = "button">Approve</button>
        <button class="denyButton" type = "button">Deny</button>
      </div>
    </template>
    
  </body>
  <script>
    function openForm() {
        document.getElementById("myForm").style.display = "block";
    }
    function closeForm() {
        document.getElementById("myForm").style.display = "none";
    }
  </script>
</html>
